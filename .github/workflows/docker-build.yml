name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Rebuild weekly to pick up Alpine package updates
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Postfix and Alpine versions
        id: versions
        run: |
          ALPINE_TAG=$(grep '^FROM alpine:' Dockerfile | sed 's/FROM alpine://')
          POSTFIX_VERSION=$(docker run --rm alpine:${ALPINE_TAG} sh -c 'apk update -q && apk search -e postfix' | grep '^postfix-[0-9]' | sed 's/postfix-\([0-9.]*\).*/\1/')
          ALPINE_VERSION=$(docker run --rm alpine:${ALPINE_TAG} cat /etc/alpine-release)
          echo "Postfix version: ${POSTFIX_VERSION}"
          echo "Alpine version: ${ALPINE_VERSION}"
          echo "postfix=${POSTFIX_VERSION}" >> $GITHUB_OUTPUT
          echo "alpine=${ALPINE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/postfix-pg:latest
            ghcr.io/${{ github.repository_owner }}/postfix-pg:${{ steps.versions.outputs.postfix }}-alpine${{ steps.versions.outputs.alpine }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One check for branch protection to require, instead of naming this
  # workflow's jobs: the gate is *handed* their results, so adding, renaming or
  # splitting a job here never means editing a protection rule again. It is also
  # where a red Renovate PR is handed to a Devin session -- a sibling job, never
  # a dependency of the gate, so it cannot affect this check's conclusion.
  # Definition and the full list of handoff preconditions: tsarna/ci-shared.
  #
  # All four permissions are required even though only the handoff uses them:
  # GitHub checks statically that no job in a called workflow requests more than
  # the caller grants, and fails the whole run at startup if one does -- skipped
  # jobs included.
  ci-success:
    name: CI Success
    if: always()
    needs: [build]
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    # Pinned by commit, as a moving tag here would let anyone who could push one
    # to ci-shared run code in every calling repo. Renovate keeps it current
    # from the trailing version comment.
    uses: tsarna/ci-shared/.github/workflows/ci-gate.yml@85244f4e73be1b93e928818027f8dee55e4e8006 # v1.2.0
    with:
      needs: ${{ toJSON(needs) }}
